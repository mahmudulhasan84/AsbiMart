name: Security Scan

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  strix-scan:
    name: Strix AI Security Pentest & SAST Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for diff-scope resolution

      - name: Install Strix CLI
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Headless Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          # Headless automated diff-scoped PR review or branch scan
          strix -n -t ./ --scan-mode quick --max-budget 10

      # Don't fail open: a run that hits hard budget exits 0 but leaves
      # run.json status "stopped", not "completed". Enforce completion explicitly.
      - name: Fail unless the scan completed
        if: always()
        run: |
          if [ -d "strix_runs" ]; then
            run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
            if [ -n "$run_json" ] && [ -f "$run_json" ]; then
              status=$(jq -r .status "$run_json")
              if [ "$status" != "completed" ]; then
                echo "Strix run status is '$status' — scan did not complete (likely budget exhausted)." >&2
                exit 1
              fi
            fi
          fi

      # Upload findings to GitHub Code Scanning (SARIF 2.1.0)
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
        continue-on-error: true
