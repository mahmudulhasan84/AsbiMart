<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — AsbiMart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-[#F4ECE1] text-slate-800 antialiased min-h-screen flex flex-col font-brand">

  <!-- Header -->
  <header class="bg-[#F4ECE1] border-b border-[#E5DACB] py-4 shadow-sm sticky top-0 z-40">
    <div class="asbi-container flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-11 h-11 flex items-center justify-center flex-shrink-0">
          <svg viewBox="0 0 100 100" class="w-full h-full" fill="none" style="shape-rendering: geometricPrecision;">
            <defs>
              <linearGradient id="wish_g" x1="28" y1="54" x2="76" y2="82" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#10B981"/>
                <stop offset="45%" stop-color="#10B981"/>
                <stop offset="75%" stop-color="#F59E0B"/>
                <stop offset="100%" stop-color="#FBBF24"/>
              </linearGradient>
            </defs>
            <path d="M24 82L56 16C58 12 62 12 64 16L84 56" stroke="#1E3A8A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M28 54H52C60 54 64 60 76 82" stroke="url(#wish_g)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="font-brand font-black text-2xl sm:text-3xl text-[#1E3A8A] tracking-tight leading-none">
          Asbi<span class="text-[#F59E0B]">Mart</span>
        </span>
      </a>
      <a href="index.html" class="flex items-center gap-2 text-xs sm:text-sm font-bold text-[#1E3A8A] hover:text-amber-600 bg-white px-4 py-2 rounded-full border border-[#E5DACB] shadow-sm transition-all">
        <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        <span>Back to Home</span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 py-10 flex-grow w-full">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <div>
        <span class="inline-block px-3 py-1 bg-rose-100 text-rose-700 text-xs font-black rounded-full uppercase">Saved Items</span>
        <h1 class="text-3xl font-black text-slate-900 mt-2">My Wishlist</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-0.5">All your favorite organic items saved in one place</p>
      </div>
      <button onclick="clearWishlistPage()" class="py-2 px-4 bg-white hover:bg-rose-50 text-rose-600 font-bold text-xs rounded-xl border border-rose-200 shadow-sm transition-all cursor-pointer">
        Clear All
      </button>
    </div>

    <div id="wishlistPageGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Populated dynamically -->
    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-500 border-t border-[#E5DACB]">
    © 2026 AsbiMart. All rights reserved.
  </footer>

  <script src="js/products.js"></script>
  <script>
    function renderWishlistPage() {
      const container = document.getElementById('wishlistPageGrid');
      let ids = [];
      try { ids = JSON.parse(localStorage.getItem('asbi_wishlist')) || []; } catch (e) {}

      const items = ids.map(id => PRODUCTS_DATA.find(p => p.id === id)).filter(Boolean);

      if (items.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white rounded-3xl p-12 text-center border border-[#E5DACB] shadow-sm space-y-3">
            <div class="w-16 h-16 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto text-3xl">❤️</div>
            <h2 class="text-lg font-black text-slate-800">Your Wishlist is Empty</h2>
            <p class="text-xs text-slate-500">Tap the heart icon on any product to save it here for quick shopping.</p>
            <a href="index.html" class="inline-block mt-2 py-2.5 px-6 bg-[#1E3A8A] hover:bg-blue-800 text-white font-bold text-xs rounded-xl shadow-md transition-all">Explore Products</a>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(p => {
        const v = p.variants[0] || { size: 'Standard', price: 0 };
        return `
          <div class="bg-white rounded-3xl border border-[#E5DACB] overflow-hidden shadow-sm hover:shadow-xl transition-all flex flex-col justify-between">
            <div class="relative h-52 bg-slate-50 overflow-hidden">
              <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
              <button onclick="removeFromWishlist('${p.id}')" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/90 hover:bg-rose-500 hover:text-white text-slate-600 flex items-center justify-center shadow-md transition-all cursor-pointer" title="Remove">✕</button>
            </div>
            <div class="p-4 flex flex-col justify-between flex-grow">
              <div>
                <h3 class="font-black text-slate-900 text-sm line-clamp-1">${p.name}</h3>
                <p class="text-xs text-slate-500 mt-0.5">${v.size}</p>
                <p class="text-lg font-black text-[#1E3A8A] mt-1.5">৳${v.price}</p>
              </div>
              <button onclick="addWishlistItemToCart('${p.id}')" class="mt-4 w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all cursor-pointer">
                Add to Cart
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function removeFromWishlist(id) {
      let ids = JSON.parse(localStorage.getItem('asbi_wishlist')) || [];
      ids = ids.filter(x => x !== id);
      localStorage.setItem('asbi_wishlist', JSON.stringify(ids));
      renderWishlistPage();
    }

    function clearWishlistPage() {
      localStorage.setItem('asbi_wishlist', JSON.stringify([]));
      renderWishlistPage();
    }

    function addWishlistItemToCart(id) {
      const p = PRODUCTS_DATA.find(x => x.id === id);
      if (!p) return;
      const v = p.variants[0];
      let cart = [];
      try { cart = JSON.parse(localStorage.getItem('asbi_cart')) || []; } catch (e) {}
      const existing = cart.find(c => c.id === p.id && c.size === v.size);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          id: p.id,
          name: p.name,
          banglaName: p.banglaName,
          image: p.image,
          size: v.size,
          price: v.price,
          quantity: 1
        });
      }
      localStorage.setItem('asbi_cart', JSON.stringify(cart));
      alert(`${p.name} added to your cart!`);
    }

    document.addEventListener('DOMContentLoaded', renderWishlistPage);
  </script>
</body>
</html>
